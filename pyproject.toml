[project]
name = "superio"
version = "0.1.0"
description = "Autonomous options trading agent on Alpaca"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.44.0",
    "anthropic>=0.40.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "rich>=13.0",
]

[tool.ruff]
line-length = 100
