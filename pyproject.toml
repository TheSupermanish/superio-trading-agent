[project]
name = "superio"
version = "0.1.0"
description = "Autonomous options trading agent on Alpaca"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.44.0",
    "anthropic>=0.40.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "fastapi>=0.115",
    "flask>=3.0",
    "uvicorn[standard]>=0.32",
    "rich>=13.0",
    "google-genai>=1.0",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.2",
    "google-api-core>=2.0",
    "mcp>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The dashboard sits next to the engine in this repo, so tell setuptools which
# directories are actually Python packages rather than letting it guess.
[tool.setuptools]
packages = ["engine", "engine.agents", "engine.strategies"]

[tool.ruff]
line-length = 100
